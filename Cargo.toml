[package]
name = "tw3-modlist-manager"
version = "2.0.0"
authors = ["Aelto <Aelto@users.noreply.github.com>"]
edition = "2024"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
time = "0.3.41"
actix-web = "4.10.2"
actix-files = "0.6.6"
actix-utils = "3.0.1"
actix-rt = "2.10.0"
actix-multipart = "0.7.2"

websocket = "0.27.1"

maud = { version = "0.27.0", features = ["actix-web"] }
rusqlite = { version = "0.35.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
futures = "0.3.31"
#chrono = { version = "0.4", features = ["serde"] }
encoding_rs_io = "0.1.7"

toml = "0.8.22"
dirs = "6.0.0"
pathdiff = "0.2.3"
symlink = "0.1.0"
qstring = "0.7.2"
fs_extra = "1.3.0"
rust-ini = "0.21"
sysinfo = "0.35.0"

[dependencies.windows]
 version = "0.61.1"
 features = [
     "Win32_Foundation",
     "Win32_UI_WindowsAndMessaging",
 ]
 
[build-dependencies]
winres = "0.1.12"
